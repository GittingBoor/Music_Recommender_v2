# Betrieb auf dem Mini-PC (BenniSmarthome), erreichbar unter
# https://music.gittingboor.de. Fuer die lokale Entwicklung bleibt
# docker-compose.yml zustaendig.
#
# Unterschiede zur Entwicklungsfassung — jeder Punkt ist Absicht:
#
#   * KEIN `ports:`. Nichts ist aus dem Heimnetz oder aus dem Internet direkt
#     erreichbar. Der einzige Weg hinein ist der Cloudflare-Tunnel, und davor
#     steht Cloudflare Access.
#   * KEIN pgAdmin. Das Passwort admin/admin war nur fuer lokal gedacht.
#   * Keine Bind-Mounts von Quellcode. Der Code steckt im Image, eine geaenderte
#     Datei auf dem Host aendert nichts, bis neu gebaut wird.
#   * Datenbank-Passwort und API-Keys kommen aus .env.prod (nicht im Git).
#   * Daten liegen unter /srv/music-recommender auf dem Mini-PC, also ausserhalb
#     von Docker und damit einfach zu sichern.
#   * Ressourcen-Limits, damit eine Analyse nicht Home Assistant mitreisst.
#
# Start:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Migrationen (einmalig und nach jedem Schema-Update):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend alembic upgrade head

name: musicrec

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${DATA_DIR}/datasets:/app/datasets
      - ${DATA_DIR}/model_cache:/app/model_cache
      - ${DATA_DIR}/short_audio:/app/short_audio
    dns:
      - 1.1.1.1
      - 8.8.8.8
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 3.0
    pids_limit: 400
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Baut die Verbindung von innen nach aussen zu Cloudflare auf. Dadurch braucht
  # die Vodafone-Box keine Portfreigabe und die Heim-IP bleibt verborgen.
  # Ziel des Public Hostname im Cloudflare-Dashboard: http://frontend:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - frontend
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
