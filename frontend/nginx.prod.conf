# nginx-Konfiguration fuer den Betrieb hinter dem Cloudflare-Tunnel.
# Die Entwicklungsfassung ist nginx.conf.

# Login-Versuche pro Besucher-IP (cloudflared liefert sie als CF-Connecting-IP,
# $remote_addr waere fuer alle der cloudflared-Container).
limit_req_zone $http_cf_connecting_ip zone=login:1m rate=6r/m;

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Die ganze Seite (Frontend und API) nur nach Login mit dem gemeinsamen
    # Passwort. Jede Anfrage fragt das Backend, ob das Sitzungs-Cookie gilt;
    # ohne gueltiges Cookie geht es auf /login (API-Aufrufe bekommen 401).
    auth_request /_auth;
    error_page 401 = @login;
    # Hinter dem Tunnel sieht nginx nur http; relative Redirects behalten https.
    absolute_redirect off;

    location = /_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @login {
        if ($uri ~ ^/api/) {
            return 401;
        }
        return 302 /login?next=$uri;
    }

    # Login-Seite und Login-Aufruf selbst sind offen.
    location = /login {
        auth_request off;
        try_files /login.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /api/auth/login {
        auth_request off;
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Die Seite soll nicht in Suchmaschinen auftauchen (zweite Linie neben dem
    # Login).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Die Admin-Routen loeschen die komplette Datenbank (DELETE /api/admin/clear)
    # bzw. starten lange Analysen (POST /api/admin/ingest). Das Frontend ruft sie
    # nicht auf, also sind sie von aussen dicht. Ueber das Heimnetz sind sie
    # weiterhin erreichbar (docker exec / direkter Containerzugriff).
    location /api/admin/ {
        return 404;
    }

    # Hochgeladene Dateien koennen gross sein.
    client_max_body_size 200m;

    # Songliste (~700 KB JSON) und JS-Bundle (~700 KB) schrumpfen auf rund ein
    # Zehntel bzw. ein Drittel. Audio ist schon komprimiert und bleibt aussen vor.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Analyse eines Songs dauert; Standard waeren 60s und damit 504er.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html immer frisch holen, sonst sehen Browser nach einem Update noch
    # das alte Bundle. Die Dateien unter /assets/ haben Hashes im Namen und
    # duerfen gecacht werden. add_header hier ersetzt die Header von oben,
    # deshalb stehen sie noch einmal da.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
