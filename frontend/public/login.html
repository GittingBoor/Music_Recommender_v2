:root {
  color-scheme: dark;
  --ground: #11100e;
  --panel: #161513;
  --raised: #1e1c19;
  --line: #2a2723;
  --line-strong: #3d3933;
  --ink: #ede9e1;
  --ink-2: #b0aa9f;
  --ink-3: #8a857b;
  --ink-4: #66625a;
  --signal: #ff6a2b;
  --bad: #f06a6a;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --sans: "Archivo", system-ui, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
           max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  background: var(--ground);
  color: var(--ink);
  font: 400 14px/20px var(--sans);
  font-feature-settings: "kern";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
::selection { background: rgb(255 106 43 / 0.35); color: var(--ink); }
:focus-visible { outline: 1px solid var(--signal); outline-offset: 1px; }

main { width: 100%; max-width: 360px; }

.card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 28px 24px 24px;
  /* the app's "active" mark: a signal rule, here along the top edge */
  box-shadow: inset 0 2px 0 var(--signal);
  animation: rise 520ms var(--ease-out) both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

.mark {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 14px;
  margin-bottom: 18px;
}
.mark span { width: 3px; background: var(--ink-4); border-radius: 0; }
.mark span:nth-child(1) { height: 6px; }
.mark span:nth-child(2) { height: 14px; background: var(--signal); }
.mark span:nth-child(3) { height: 9px; }
.mark span:nth-child(4) { height: 4px; }

h1 {
  margin: 0;
  font-size: 24px;
  line-height: 28px;
  font-weight: 700;
  font-stretch: 112.5%;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.lede {
  margin: 6px 0 0;
  color: var(--ink-3);
  font-size: 14px;
  line-height: 20px;
}

form { margin-top: 28px; }
label {
  display: block;
  margin-bottom: 6px;
  font: 400 11px/14px var(--mono);
  color: var(--ink-3);
}
.field {
  position: relative;
  display: flex;
}
input {
  width: 100%;
  height: 44px;
  margin: 0;
  padding: 0 48px 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  background: var(--raised);
  color: var(--ink);
  caret-color: var(--signal);
  /* 16px keeps iOS Safari from zooming on focus */
  font: 400 16px/22px var(--sans);
  letter-spacing: 0.02em;
  transition: border-color 120ms ease-out;
}
input:hover { border-color: var(--ink-4); }
input:focus { outline: none; border-color: var(--signal); }
input:focus-visible { outline: none; }
input[aria-invalid="true"] { border-color: var(--bad); }
input::-ms-reveal, input::-ms-clear { display: none; }

.toggle {
  position: absolute;
  top: 1px; right: 1px; bottom: 1px;
  width: 44px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 0 1px 1px 0;
  background: transparent;
  color: var(--ink-3);
  cursor: pointer;
  transition: color 120ms ease-out;
}
.toggle:hover { color: var(--ink); }
.toggle:focus-visible { outline-offset: -3px; }
.toggle svg { width: 18px; height: 18px; }
.toggle .eye-off { display: none; }
.toggle[aria-pressed="true"] .eye { display: none; }
.toggle[aria-pressed="true"] .eye-off { display: block; }

.error {
  min-height: 20px;
  margin: 8px 0 0;
  color: var(--bad);
  font-size: 13px;
  line-height: 18px;
}

button[type="submit"] {
  position: relative;
  width: 100%;
  height: 44px;
  margin-top: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 1px solid var(--signal);
  border-radius: 2px;
  background: var(--signal);
  color: var(--ground);
  font: 600 14px/20px var(--sans);
  font-stretch: 112.5%;
  letter-spacing: 0.005em;
  cursor: pointer;
  transition: background-color 120ms ease-out, border-color 120ms ease-out, color 120ms ease-out;
}
button[type="submit"]:hover { background: var(--ink); border-color: var(--ink); }
button[type="submit"]:active { transform: translateY(1px); }
button[type="submit"]:focus-visible { outline-offset: 2px; }
button[type="submit"][aria-busy="true"] {
  cursor: progress;
  background: var(--raised);
  border-color: var(--line-strong);
  color: var(--ink-2);
}

/* Loading: a tiny level meter instead of a spinner. */
.meter { display: none; align-items: flex-end; gap: 2px; height: 12px; }
.meter i { width: 2px; height: 100%; background: var(--signal); transform-origin: bottom; animation: level 900ms ease-in-out infinite; }
.meter i:nth-child(2) { animation-delay: -300ms; }
.meter i:nth-child(3) { animation-delay: -600ms; }
button[aria-busy="true"] .meter { display: inline-flex; }
@keyframes level {
  0%, 100% { transform: scaleY(0.25); }
  50% { transform: scaleY(1); }
}

.shake { animation: shake 360ms var(--ease-out); }
@keyframes shake {
  0%, 100% { transform: none; }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(2px); }
}

@media (min-width: 640px) {
  main { max-width: 400px; }
  .card { padding: 36px 32px 32px; }
  h1 { font-size: 28px; line-height: 32px; }
}

@media (prefers-reduced-motion: reduce) {
  .card, .shake { animation: none; }
  .meter i { animation: none; transform: scaleY(0.6); }
  button[type="submit"]:active { transform: none; }
  * { transition-duration: 0ms !important; }
}
</style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="title">
    <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <h1 id="title">Music Recommender</h1>
    <p class="lede">Private — enter the password</p>

    <form id="login" method="post" action="/api/auth/login" novalidate>
      <label for="password">Password</label>
      <div class="field" id="field">
        <input id="password" name="password" type="password" autocomplete="current-password"
               autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus
               aria-describedby="error">
        <button type="button" class="toggle" id="toggle" aria-pressed="false" aria-controls="password" aria-label="Show password">
          <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.6M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>
        </button>
      </div>
      <p class="error" id="error" role="status" aria-live="polite" aria-atomic="true"></p>
      <button type="submit" id="submit">
        <span class="meter" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="submit-label">Sign in</span>
      </button>
    </form>
  </section>
</main>
<script>
(function () {
  "use strict";

  var MESSAGES = {
    wrong: "Wrong password.",
    throttled: "Too many attempts. Wait a minute and try again.",
    unavailable: "Login is unavailable right now. Try again later.",
    empty: "Enter the password."
  };
  var LABEL_IDLE = "Sign in";
  var LABEL_BUSY = "Checking";

  var form = document.getElementById("login");
  var input = document.getElementById("password");
  var field = document.getElementById("field");
  var toggle = document.getElementById("toggle");
  var error = document.getElementById("error");
  var submit = document.getElementById("submit");
  var submitLabel = document.getElementById("submit-label");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  /** Only same-origin paths: "/x" yes; "//host", "/\\host", control chars, other origins no. */
  function safeNext() {
    var next = new URLSearchParams(window.location.search).get("next");
    if (!next || next.charAt(0) !== "/" || next.charAt(1) === "/" || next.charAt(1) === "\\") return "/";
    if (/[\u0000-\u001f\u007f]/.test(next)) return "/";
    try {
      var url = new URL(next, window.location.origin);
      if (url.origin !== window.location.origin) return "/";
      return url.pathname + url.search + url.hash;
    } catch (e) {
      return "/";
    }
  }

  function setBusy(busy) {
    submit.disabled = busy;
    submit.setAttribute("aria-busy", busy ? "true" : "false");
    submitLabel.textContent = busy ? LABEL_BUSY : LABEL_IDLE;
  }

  function showError(message, clear) {
    error.textContent = message;
    input.setAttribute("aria-invalid", "true");
    if (clear) input.value = "";
    input.focus();
    if (!reduceMotion.matches) {
      field.classList.remove("shake");
      void field.offsetWidth; // restart the animation
      field.classList.add("shake");
    }
  }

  field.addEventListener("animationend", function () { field.classList.remove("shake"); });

  input.addEventListener("input", function () {
    if (input.getAttribute("aria-invalid") === "true") {
      input.removeAttribute("aria-invalid");
      error.textContent = "";
    }
  });

  toggle.addEventListener("click", function () {
    var show = input.type === "password";
    input.type = show ? "text" : "password";
    toggle.setAttribute("aria-pressed", show ? "true" : "false");
    toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    input.focus();
  });

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (submit.disabled) return;
    var password = input.value;
    if (!password) {
      showError(MESSAGES.empty, false);
      return;
    }
    error.textContent = "";
    setBusy(true);

    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password }),
      credentials: "same-origin"
    }).then(function (response) {
      if (response.status === 204) {
        window.location.replace(safeNext());
        return;
      }
      setBusy(false);
      if (response.status === 401) showError(MESSAGES.wrong, true);
      else if (response.status === 429) showError(MESSAGES.throttled, false);
      else showError(MESSAGES.unavailable, false);
    }).catch(function () {
      setBusy(false);
      showError(MESSAGES.unavailable, false);
    });
  });
})();
</script>
</body>
</html>
